<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Extra Sauce</title>
  <meta name="description" content="Extra Sauce - وجبات سريعة، اطلب مباشرة عبر واتساب">
  <meta name="theme-color" content="#0d0d0d">
  <link rel="icon" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <meta property="og:title" content="Extra Sauce">
  <meta property="og:image" content="logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <a class="brand" href="#top" aria-label="Extra Sauce">
      <img src="logo.png" alt="" class="brand-img" onerror="this.remove()">
      <span class="brand-name">EXTRA <b>SAUCE</b></span>
    </a>
    <button class="cart-btn" id="cartBtn" aria-label="فتح السلة">🛒 السلة (<span id="cartCount">0</span>)</button>
  </header>

  <section class="hero" id="top">
    <div class="hero-logo">
      <img src="logo.png" alt="شعار Extra Sauce" onerror="this.parentElement.classList.add('no-img')">
      <div class="hero-fallback" aria-hidden="true">EXTRA<br><b>SAUCE</b></div>
    </div>
    <h1>نكهة <em>قوية</em>.. وصوص زيادة</h1>
    <p>اختر وجبتك، حدد موقعك، وأرسل طلبك عبر واتساب</p>
  </section>

  <main class="container">
    <input class="search" id="search" type="search" placeholder="ابحث عن وجبة..." aria-label="بحث">
    <nav class="cats" id="cats" aria-label="الأقسام"></nav>
    <div id="menu"></div>
  </main>

  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer" aria-label="سلة الطلب">
    <div class="drawer-head">
      <strong>طلبك</strong>
      <button id="closeCart" aria-label="إغلاق">×</button>
    </div>
    <div class="drawer-body">
      <div id="cartLines"></div>
      <div class="total"><span>المجموع</span><span id="cartTotal"></span></div>

      <label class="field"><span>الاسم *</span><input id="cName" autocomplete="name"></label>
      <label class="field"><span>رقم الهاتف *</span><input id="cPhone" type="tel" inputmode="tel" autocomplete="tel"></label>
      <button class="btn alt" id="locBtn" type="button">📍 تحديد موقعي</button>
      <div class="loc-status" id="locStatus">لم يتم تحديد الموقع</div>
      <label class="field"><span>العنوان / ملاحظات (اختياري)</span><textarea id="cNote" rows="2"></textarea></label>
      <div class="error" id="err" role="alert"></div>
      <button class="btn" id="sendBtn" type="button">إرسال الطلب عبر واتساب</button>
    </div>
  </aside>

  <div class="modal" id="gate" hidden>
    <div class="sheet gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
      <img src="logo.png" alt="" class="gate-logo">
      <strong id="gateTitle">رمز الدخول</strong>
      <label class="field"><span class="sr-only">الرمز</span>
        <input id="gateCode" type="password" inputmode="numeric" maxlength="8" autocomplete="off" class="gate-input">
      </label>
      <div class="error" id="gateErr" role="alert"></div>
      <button class="btn" id="gateOk" type="button">دخول</button>
      <button class="btn ghost" id="gateCancel" type="button" style="margin-top:8px">إلغاء</button>
    </div>
  </div>

  <script src="shared.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
